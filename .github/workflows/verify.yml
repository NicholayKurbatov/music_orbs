name: Проверки Music Orbs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, MIT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, MIT
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: graphics/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, MIT
        with:
          distribution: temurin
          java-version: '17'
      - name: TypeScript, schema и графика
        run: |
          npm ci --prefix graphics
          npm test --prefix graphics
          npm run build --prefix graphics
      - name: Browser smoke
        run: MUSIC_ORBS_BROWSER="$(command -v google-chrome)" npm run test:browser --prefix graphics
      - name: JVM без Android SDK
        run: bash gradlew -PjvmOnly :core:test --console=plain
      - name: Синтаксис device runners и синтетическая PCM-фикстура
        run: |
          node --check scripts/android-visual-acceptance.mjs
          node --check scripts/android-motion-transitions.mjs
          node --check scripts/android-context-probe.mjs
          node --check scripts/android-palette-probe.mjs
          node --check scripts/android-render-probe.mjs
          node scripts/android-motion-transitions.mjs --self-check
      - name: Документация и направления импортов
        run: node scripts/check-project.mjs
      - name: OpenSpec
        run: npm exec --yes --package @fission-ai/openspec@1.14.3 -- openspec validate --all --strict --no-interactive

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, MIT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, MIT
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, MIT
        with:
          distribution: temurin
          java-version: '17'
      - name: Локальные assets и debug APK
        run: |
          npm ci --prefix graphics
          npm run build --prefix graphics
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
